<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="description" content="Calliope — self-hosted music downloader and library manager" />
		<meta name="application-name" content="Calliope" />
		<meta name="apple-mobile-web-app-title" content="Calliope" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="theme-color" content="#000000" />
		<meta name="color-scheme" content="dark" />
		<meta name="robots" content="noindex, nofollow" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Calliope" />
		<meta property="og:title" content="Calliope" />
		<meta property="og:description" content="Self-hosted music downloader and library manager" />
		<meta property="og:image" content="%sveltekit.assets%/icon-512.png" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
